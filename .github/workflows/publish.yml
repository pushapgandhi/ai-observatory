name: Weekly AI update and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-observatory-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public sources
        id: refresh
        run: python scripts/update.py
      - name: Validate archive and ingestion
        run: python -m unittest discover -s tests -v
      - name: Validate browser JavaScript
        run: node --check dist/app.js
      - name: Save updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh AI archive from public sources"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report unavailable sources after publishing status
        if: steps.refresh.outputs.degraded == 'true'
        run: |
          echo "::error::At least one source could not refresh. The preserved archive and source status were published. See dist/data.json."
          exit 1
